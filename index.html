<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f3b5f">
<title>Boardwalk Rivals</title>
<style>
:root{--sea:#1d9bb5;--navy:#12355b;--sand:#f6e3b8;--coral:#ff6f59;--sun:#ffd166;--wood:#a8703f;--cream:#fff8ea;--ink:#1d2b3a;--mint:#3cc9a4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0f3b5f;color:var(--ink);font-family:ui-rounded,"SF Pro Rounded","Avenir Next","Nunito","Trebuchet MS",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas#cv{position:fixed;left:0;top:0;width:100%;height:100%;touch-action:none;display:block}
#hud{position:fixed;left:0;right:0;top:0;height:60px;display:none;align-items:center;gap:10px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));pointer-events:none;z-index:5}
#hud.on{display:flex}
#hud .chip{pointer-events:auto;display:flex;align-items:center;gap:8px;background:rgba(255,248,234,.94);border-radius:999px;padding:6px 14px 6px 6px;box-shadow:0 3px 0 rgba(0,0,0,.25);font-weight:800;font-size:15px;white-space:nowrap;max-width:38vw;overflow:hidden;min-width:0}
#hud .chip.turn{outline:3px solid var(--sun);box-shadow:0 0 0 6px rgba(255,209,102,.35),0 3px 0 rgba(0,0,0,.25)}
#hud .chip .dot{width:30px;height:30px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;overflow:hidden}
#hud .chip .dot img{width:30px;height:30px}
#hud .chip .nm{overflow:hidden;text-overflow:ellipsis;min-width:0}
#hud .chip .sc{flex:none;font-variant-numeric:tabular-nums;background:var(--navy);color:#fff;border-radius:999px;padding:1px 9px;margin-left:2px}
#hud .mid{flex:1;text-align:center;color:#fff;font-weight:800;font-size:15px;text-shadow:0 2px 0 rgba(0,0,0,.35);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hud .hb{pointer-events:auto;border:0;background:rgba(255,248,234,.94);color:var(--navy);font:inherit;font-weight:900;border-radius:14px;min-width:44px;height:44px;padding:0 12px;box-shadow:0 3px 0 rgba(0,0,0,.25);display:flex;align-items:center;gap:6px;cursor:pointer;font-size:15px}
#hud .hb svg{width:22px;height:22px}
#hud .tix{pointer-events:auto;display:flex;align-items:center;gap:6px;background:var(--coral);color:#fff;border-radius:999px;padding:6px 14px;font-weight:900;font-size:17px;box-shadow:0 3px 0 rgba(0,0,0,.25)}
#hud .tix svg{width:24px;height:24px}
#ui{position:fixed;inset:0;z-index:10;pointer-events:none}
.veil{position:absolute;inset:0;background:rgba(9,30,50,.55);pointer-events:auto;display:flex;align-items:center;justify-content:center;padding:14px}
.veil.clear{background:radial-gradient(ellipse at center,rgba(9,30,50,.62),rgba(9,30,50,.18) 70%)}
.panel{position:relative;background:var(--cream);border-radius:22px;box-shadow:0 8px 0 rgba(0,0,0,.25),0 20px 60px rgba(0,0,0,.35);padding:20px 22px;max-width:760px;width:100%;max-height:calc(100% - 10px);overflow:auto;-webkit-overflow-scrolling:touch;border:4px solid #fff}
.panel.wide{max-width:900px}
.panel.small{max-width:470px}
.panel h1,.panel h2{margin:0 0 6px;color:var(--navy);letter-spacing:.3px}
.panel h2{font-size:28px}
.panel h3{margin:14px 0 6px;color:var(--navy);font-size:15px;text-transform:uppercase;letter-spacing:1.5px;opacity:.75}
.panel p{margin:6px 0;line-height:1.4}
.tag{color:#5b6b7b;font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.c{justify-content:center}
.btn{font:inherit;font-weight:800;font-size:16px;border:0;border-radius:14px;padding:11px 16px;min-height:46px;background:#e8dcc4;color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.18);cursor:pointer;transition:transform .08s;outline:none;position:relative}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn.go{background:var(--coral);color:#fff;font-size:19px;padding:12px 26px}
.btn.blue{background:var(--sea);color:#fff}
.btn.navy{background:var(--navy);color:#fff}
.btn.on{background:var(--navy);color:#fff}
.btn[disabled]{opacity:.45;cursor:default}
.btn.focus,.btn:focus-visible{outline:4px solid var(--sun);outline-offset:2px;box-shadow:0 0 0 8px rgba(255,209,102,.4),0 4px 0 rgba(0,0,0,.18)}
.chars{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.char{display:flex;align-items:center;gap:8px;text-align:left;padding:8px}
.char img{width:46px;height:46px;flex:none}
.char small{display:block;font-weight:600;opacity:.75;font-size:12px}
.char.on small{opacity:.9}
.char.lock img{filter:grayscale(1) brightness(.7)}
.howto{background:#fff;border-radius:14px;padding:10px 14px;margin:8px 0}
.howto li{margin:4px 0;line-height:1.35}
.kbd{display:inline-block;background:var(--navy);color:#fff;border-radius:6px;padding:0 6px;font-size:13px;font-weight:800;margin:0 1px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.item{text-align:left;display:flex;gap:10px;align-items:center}
.item .ic{font-size:30px;width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center}
.item .ic img{width:44px;height:44px}
.item small{display:block;font-weight:600;opacity:.75;font-size:12px}
.price{margin-left:auto;background:var(--coral);color:#fff;border-radius:999px;padding:2px 9px;font-size:13px;white-space:nowrap}
.price.own{background:var(--mint)}
table.rec{border-collapse:collapse;width:100%;font-size:14px;background:#fff;border-radius:12px;overflow:hidden}
table.rec th,table.rec td{padding:6px 8px;text-align:center;border-bottom:1px solid #eee}
table.rec th{background:var(--navy);color:#fff;font-size:12px;letter-spacing:1px;text-transform:uppercase}
table.rec td:first-child,table.rec th:first-child{text-align:left}
.set{display:flex;align-items:center;gap:12px;margin:8px 0;font-weight:700}
.set label{min-width:120px}
.set input[type=range]{flex:1;accent-color:var(--coral);height:30px}
.set input[type=text]{font:inherit;font-weight:700;padding:8px 10px;border-radius:10px;border:2px solid #d8c9a8;width:160px;-webkit-user-select:text;user-select:text}
.title{text-align:center;background:transparent;border:0;box-shadow:none;color:#fff;max-width:640px}
.logo{font-size:min(15vw,92px);line-height:.88;font-weight:900;letter-spacing:1px;color:var(--sun);text-shadow:0 5px 0 var(--coral),0 10px 0 #7a2f22,0 18px 30px rgba(0,0,0,.45);margin:0 0 8px;transform:rotate(-3deg)}
.logo span{display:block;color:#fff;font-size:.62em;text-shadow:0 4px 0 var(--sea),0 8px 0 var(--navy),0 14px 24px rgba(0,0,0,.4)}
.title p{font-weight:800;font-size:18px;text-shadow:0 2px 0 rgba(0,0,0,.4)}
.title .btn{min-width:180px}
.blink{animation:bl 1.4s infinite}
@keyframes bl{50%{opacity:.35}}
.res{text-align:center}
.res .big{font-size:40px;font-weight:900;color:var(--navy);margin:4px 0}
.res .tk{display:inline-flex;align-items:center;gap:8px;background:var(--coral);color:#fff;border-radius:999px;padding:6px 16px;font-weight:900;font-size:22px;margin:8px 0}
.res .tk svg{width:28px;height:28px}
.res img{width:84px;height:84px}
#quip{position:fixed;z-index:6;top:70px;right:12px;max-width:min(360px,80vw);display:flex;gap:10px;align-items:center;background:#fff;border-radius:18px;padding:8px 14px 8px 8px;box-shadow:0 5px 0 rgba(0,0,0,.2),0 10px 30px rgba(0,0,0,.25);font-weight:800;opacity:0;transform:translateY(-10px);transition:opacity .25s,transform .25s;pointer-events:none}
#quip.on{opacity:1;transform:none}
#quip.left{right:auto;left:12px}
#quip img{width:46px;height:46px;flex:none}
#quip small{display:block;color:#7a8a9a;font-size:12px}
#toast{position:fixed;z-index:20;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;font-weight:800;padding:10px 18px;border-radius:999px;box-shadow:0 5px 0 rgba(0,0,0,.25);opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;text-align:center;max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%)}
#hint{position:fixed;z-index:4;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);color:#fff;font-weight:800;font-size:14px;background:rgba(18,53,91,.72);padding:7px 14px;border-radius:999px;display:none;white-space:nowrap;pointer-events:none}
#hint.on{display:block}
.reduced *{transition:none!important;animation:none!important}
@media (max-width:600px){.panel{padding:14px}.panel h2{font-size:22px}#hud .chip{font-size:13px;max-width:30vw}.btn{font-size:15px}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud"></div>
<div id="hint"></div>
<div id="quip"></div>
<div id="toast"></div>
<div id="ui"></div>
<noscript>Boardwalk Rivals needs JavaScript.</noscript>
<script>
'use strict';
/* ================= Boardwalk Rivals — core ================= */
const BR = {}; window.BR = BR;
BR.VERSION = '1.0 · Wave 1';
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const ri = n => (Math.random() * n) | 0;
const pick = a => a[ri(a.length)];
const now = () => performance.now();
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = ri(i + 1); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function rrect(c, x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
BR.util = { clamp, lerp, rnd, ri, pick, shuffle, rrect, esc };

/* ================= Save (versioned schema) ================= */
const SAVE_KEY = 'boardwalk-rivals-save';
const SAVE_VERSION = 1;
function statBlock() { return { played: 0, ai: { easy: { w: 0, l: 0, d: 0 }, medium: { w: 0, l: 0, d: 0 }, hard: { w: 0, l: 0, d: 0 } }, local: { p1: 0, p2: 0, d: 0 }, best: 0 }; }
function saveDefaults() {
  let rm = false; try { rm = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) { }
  return { v: SAVE_VERSION, tickets: 0, lifetime: 0, owned: {}, chars: {}, decor: {}, stats: {}, rivals: {}, h2h: { p1: 0, p2: 0, d: 0 }, names: ['Player 1', 'Player 2'], setup: {}, settings: { master: 0.8, music: 0.5, sfx: 0.85, rumble: true, reduced: rm }, flags: {} };
}
/* Later waves: add BR.MIGRATIONS[n] = s => { ...; s.v = n + 1; return s; } and bump SAVE_VERSION. Unknown keys are always preserved. */
BR.MIGRATIONS = {};
function isObj(o) { return !!o && typeof o === 'object' && !Array.isArray(o); }
function fillDefaults(d, s) {
  for (const k in d) {
    if (s[k] === undefined || (s[k] === null && d[k] !== null) || (isObj(d[k]) && !isObj(s[k])) || (typeof d[k] !== typeof s[k] && !isObj(d[k]))) s[k] = JSON.parse(JSON.stringify(d[k]));
    else if (isObj(d[k])) fillDefaults(d[k], s[k]);
  }
  return s;
}
const Save = BR.save = {
  data: null, key: SAVE_KEY, version: SAVE_VERSION,
  load() {
    let s = null;
    try { const raw = localStorage.getItem(SAVE_KEY); if (raw) s = JSON.parse(raw); } catch (e) { s = null; }
    if (!isObj(s)) s = { v: SAVE_VERSION };
    if (typeof s.v !== 'number') s.v = 1;
    while (s.v < SAVE_VERSION) { const m = BR.MIGRATIONS[s.v]; if (!m) { s.v = SAVE_VERSION; break; } s = m(s); }
    this.data = fillDefaults(saveDefaults(), s);
    if (!Array.isArray(this.data.names) || this.data.names.length < 2) this.data.names = ['Player 1', 'Player 2'];
    return this.data;
  },
  write() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(this.data)); } catch (e) { } },
  reset() { const keep = this.data.settings; this.data = saveDefaults(); this.data.settings = keep; this.write(); },
  stats(id) { const st = this.data.stats; if (!isObj(st[id])) st[id] = statBlock(); return fillDefaults(statBlock(), st[id]); }
};
const S = () => Save.data;

/* ================= Tickets & difficulty APIs ================= */
BR.DIFFS = ['easy', 'medium', 'hard'];
BR.DIFF = { easy: { label: 'Easy', win: 4, color: '#3fae5a' }, medium: { label: 'Medium', win: 8, color: '#f2a33a' }, hard: { label: 'Hard', win: 15, color: '#e94b3c' } };
BR.tickets = {
  get: () => S().tickets,
  add(n) { n = Math.max(0, Math.round(n)); if (!n) return 0; S().tickets += n; S().lifetime += n; Save.write(); return n; },
  spend(n) { if (S().tickets < n) return false; S().tickets -= n; Save.write(); return true; }
};

/* ================= Characters ================= */
BR.CHARS = [
  { id: 'gus', name: "Cap'n Gus", title: 'Salty fisherman', color: '#2f5d8a', cost: 0, skin: '#eab489', hair: '#f4f4f4', hat: 'cap', acc: 'beard',
    bio: 'Forty years on the pier. Plays slow, bites hard.',
    q: { start: ["Reel 'er in, rookie.", "I've wrestled marlins tougher'n you.", 'Tide waits for no one. Neither do I.'], good: ['Hooked ya!', "That's a keeper!", 'Barnacles! Nice one... for me.'], bad: ['Bah, a nibble.', "Seaweed in my gears.", 'Lucky cast.'], win: ['Another one for the cooler!', 'Fish on! And you\'re the fish.'], lose: ['Well, shiver me... good game.', "You've got sea legs after all."], draw: ['Calm waters. A draw.'] } },
  { id: 'kai', name: 'Kai Breakwater', title: 'Surf instructor', color: '#14a89a', cost: 0, skin: '#c98b5e', hair: '#f3c54a', hat: 'none', acc: 'shades',
    bio: 'Totally chill until the last wave.',
    q: { start: ['Cowabunga, let\'s ride!', 'Good vibes only, dude.', 'Paddle out, let\'s go!'], good: ['Gnarly!', 'Shaka, brah!', 'Riding the barrel!'], bad: ['Wipeout, man.', 'Whoa, rogue wave.', 'Bummer, dude.'], win: ['Totally tubular win!', 'Caught the perfect wave!'], lose: ['Radical game, friend.', 'You shredded that!'], draw: ['Flat water, dude. Draw.'] } },
  { id: 'shelly', name: 'Shelly Watts', title: 'Lifeguard', color: '#e94b3c', cost: 0, skin: '#f1c7a0', hair: '#7a4a2a', hat: 'visor', acc: 'whistle',
    bio: 'By the book, eyes on everything.',
    q: { start: ['Rules are posted. Play fair.', 'Eyes up. I see everything.', 'Whistle\'s ready. Let\'s go.'], good: ['Tweet! Got you.', 'Textbook.', 'Spotted that a mile out.'], bad: ['Hmm. Noted.', 'Didn\'t see that coming.', 'Okay, okay.'], win: ['Rescue complete. Mine!', 'Back to the tower, champ.'], lose: ['Clean win. Respect.', 'Lifeguard down! Well played.'], draw: ['Everybody\'s safe. Draw.'] } },
  { id: 'zola', name: 'Madame Zola', title: 'Fortune teller', color: '#7b4bb3', cost: 40, skin: '#d49a74', hair: '#2b1a3a', hat: 'scarf', acc: 'hoops',
    bio: 'Already knows how this ends. Usually.',
    q: { start: ['The cards foresaw this meeting...', 'Cross my palm with tickets.', 'Your fate is... interesting.'], good: ['As the stars predicted.', 'I saw it in the crystal.', 'Destiny smiles on me.'], bad: ['The mists are... cloudy.', 'Mercury must be in retrograde.', 'That was not in the cards!'], win: ['Fate has spoken.', 'I told you so. Days ago.'], lose: ['The future... surprised me.', 'A twist even I missed!'], draw: ['Balance in all things.'] } },
  { id: 'fudge', name: 'Fudge Fontaine', title: 'Taffy puller', color: '#ff7aa8', cost: 70, skin: '#f2c9a8', hair: '#c45a2a', hat: 'chef', acc: 'none',
    bio: 'Sweet as taffy. Sticky as taffy, too.',
    q: { start: ['Sweet! A challenger!', 'Let\'s stir things up!', 'Fresh batch of trouble coming up!'], good: ['Sugar rush!', 'Sweet move!', 'Stuck on me now!'], bad: ['Sour grapes!', 'Ooh, sticky.', 'That left a bitter taste.'], win: ['Sweet victory!', 'Saltwater taffy for the winner!'], lose: ['You earned a treat!', 'Ooh, that was delicious play.'], draw: ['Half a taffy each!'] } },
  { id: 'gail', name: 'Gizmo Gail', title: 'Arcade mechanic', color: '#f2a33a', cost: 100, skin: '#8d5a3b', hair: '#1c1c1c', hat: 'goggles', acc: 'wrench',
    bio: 'Fixes every machine. Beats everyone on them.',
    q: { start: ['Calibrating... ready.', 'I built half these booths.', 'Insert coin, challenger.'], good: ['Optimal.', 'Precision engineering.', 'Click. Whirr. Gotcha.'], bad: ['Loose bolt.', 'Recalculating...', 'Huh. Glitch.'], win: ['High score: me.', 'Machine says: winner, Gail.'], lose: ['You beat the mechanic!', 'Need a tune-up after that.'], draw: ['Tie game. Rebooting.'] } }
];
BR.char = id => BR.CHARS.find(c => c.id === id) || BR.CHARS[0];
BR.charUnlocked = c => c.cost === 0 || !!S().chars[c.id];
function drawFace(c, ch, x, y, r) {
  c.save(); c.translate(x, y);
  c.beginPath(); c.arc(0, 0, r, 0, TAU); c.fillStyle = ch.color; c.fill();
  c.save(); c.beginPath(); c.arc(0, 0, r, 0, TAU); c.clip();
  // shoulders
  c.fillStyle = shade(ch.color, -30); c.beginPath(); c.ellipse(0, r * 1.05, r * .85, r * .55, 0, 0, TAU); c.fill();
  if (ch.hat === 'scarf' || ch.id === 'shelly') { c.fillStyle = ch.hair; c.beginPath(); c.ellipse(0, r * .15, r * .62, r * .7, 0, 0, TAU); c.fill(); }
  // head
  c.fillStyle = ch.skin; c.beginPath(); c.ellipse(0, -r * .02, r * .5, r * .56, 0, 0, TAU); c.fill();
  // hair
  c.fillStyle = ch.hair;
  if (ch.id === 'kai') { c.beginPath(); for (let i = 0; i < 7; i++) { const a = Math.PI + i * Math.PI / 6; c.lineTo(Math.cos(a) * r * .62, -r * .2 + Math.sin(a) * r * .55); c.lineTo(Math.cos(a + .26) * r * .4, -r * .2 + Math.sin(a + .26) * r * .4); } c.closePath(); c.fill(); }
  else if (ch.id === 'fudge') { for (let i = -2; i <= 2; i++) { c.beginPath(); c.arc(i * r * .2, -r * .32, r * .14, 0, TAU); c.fill(); } }
  else if (ch.id === 'gail' || ch.id === 'shelly') { c.beginPath(); c.ellipse(0, -r * .32, r * .52, r * .3, 0, Math.PI, TAU); c.fill(); }
  else if (ch.id === 'gus') { c.beginPath(); c.ellipse(0, r * .3, r * .48, r * .34, 0, 0, Math.PI); c.fill(); c.beginPath(); c.ellipse(0, r * .22, r * .5, r * .2, 0, 0, TAU); c.fill(); c.fillStyle = ch.skin; c.beginPath(); c.ellipse(0, r * .2, r * .16, r * .08, 0, 0, TAU); c.fill(); }
  // eyes
  const ey = -r * .05;
  if (ch.acc === 'shades') { c.fillStyle = '#122'; rrect(c, -r * .42, ey - r * .1, r * .36, r * .2, r * .07); c.fill(); rrect(c, r * .06, ey - r * .1, r * .36, r * .2, r * .07); c.fill(); c.fillRect(-r * .1, ey - r * .05, r * .2, r * .04); c.fillStyle = 'rgba(255,255,255,.5)'; c.fillRect(-r * .36, ey - r * .07, r * .1, r * .04); }
  else { c.fillStyle = '#1d2b3a'; c.beginPath(); c.arc(-r * .18, ey, r * .065, 0, TAU); c.arc(r * .18, ey, r * .065, 0, TAU); c.fill(); }
  // mouth
  c.strokeStyle = '#7a2f22'; c.lineWidth = Math.max(1, r * .06); c.lineCap = 'round'; c.beginPath(); c.arc(0, r * .14, r * .16, .25, Math.PI - .25); c.stroke();
  c.fillStyle = 'rgba(255,110,110,.35)'; c.beginPath(); c.arc(-r * .3, r * .1, r * .08, 0, TAU); c.arc(r * .3, r * .1, r * .08, 0, TAU); c.fill();
  // hats

/* ================= Shared turn-based game base ================= */
class TurnGame {
  constructor(s) { this.s = s; this.k = BR.turnKit(s); this.t = 0; this.anim = null; this.fx = []; this.cur = { x: 0, y: 0 }; this.msg = ''; }
  seat() { return this.st.turn; }
  humanTurn() { return !this.s.over && !this.anim && !this.blocked && this.k.isHuman(this.seat()); }
  update(dt) {
    this.t += dt;
    for (const f of this.fx) f.t += dt; this.fx = this.fx.filter(f => f.t < (f.d || 1));
    if (this.anim) { this.anim.t += dt / (this.s.fast ? 0.02 : this.anim.d); if (this.anim.t >= 1) { const a = this.anim; this.anim = null; if (a.done) a.done(); } return; }
    if (this.s.over || this.blocked) return;
    const seat = this.seat();
    if (this.k.isHuman(seat)) this.humanInput(this.k.nav(seat), seat);
    else if (!this.k.thinking) this.k.ai(() => this.aiPick(seat, this.s.players[seat].diff), m => { if (m != null) this.commit(m); }, this.thinkMs ? this.thinkMs() : undefined);
  }
  moveCursor(n, cols, rows) { if (n.dx || n.dy) { this.cur.x = clamp(this.cur.x + n.dx, 0, cols - 1); this.cur.y = clamp(this.cur.y + n.dy, 0, rows - 1); Snd.play('move'); return true; } return false; }
  status(extra) {
    const s = this.s, seat = this.seat(), p = s.players[seat];
    if (s.over) return 'Game over';
    if (!p.human) return p.name + (this.k.thinking ? ' is thinking…' : '');
    if (s.mode === 'ai') return extra || 'Your move';
    return p.name + ': ' + (extra || 'your move');
  }
  destroy() { this.k.clear(); }
  testInfo() { return { over: this.s.over, turn: this.seat(), human: this.humanTurn(), clicks: this.humanTurn() ? this.testClicks() : null }; }
  burst(x, y, col, n) { if (S().settings.reduced) n = Math.min(n || 12, 5); for (let i = 0; i < (n || 12); i++) { const a = Math.random() * TAU, v = rnd(40, 160); this.fx.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, col, t: 0, d: rnd(.4, .8) }); } }
  drawFx(c) { for (const f of this.fx) { if (f.vx === undefined) continue; const k = f.t; c.globalAlpha = Math.max(0, 1 - k / f.d); c.fillStyle = f.col; c.beginPath(); c.arc(f.x + f.vx * k, f.y + f.vy * k + 80 * k * k, 4, 0, TAU); c.fill(); } c.globalAlpha = 1; }
}
BR.TurnGame = TurnGame;
/* simple board-cell hit test */
function cellAt(b, x, y, cols, rows) { const cx = Math.floor((x - b.x) / b.cs), cy = Math.floor((y - b.y) / b.cs); if (cx < 0 || cy < 0 || cx >= cols || cy >= rows) return null; return { x: cx, y: cy }; }
function cellCenter(b, x, y) { return [b.x + (x + .5) * b.cs, b.y + (y + .5) * b.cs]; }
function drawX(c, x, y, r, col, k) { k = k == null ? 1 : k; c.save(); c.strokeStyle = col || '#ff6f59'; c.lineWidth = r * .28; c.lineCap = 'round'; c.beginPath(); c.moveTo(x - r, y - r); c.lineTo(x - r + 2 * r * Math.min(1, k * 2), y - r + 2 * r * Math.min(1, k * 2)); if (k > .5) { const q = (k - .5) * 2; c.moveTo(x + r, y - r); c.lineTo(x + r - 2 * r * q, y - r + 2 * r * q); } c.stroke(); c.restore(); }
function drawO(c, x, y, r, col, k) { k = k == null ? 1 : k; c.save(); c.strokeStyle = col || '#1d9bb5'; c.lineWidth = r * .28; c.lineCap = 'round'; c.beginPath(); c.arc(x, y, r, -Math.PI / 2, -Math.PI / 2 + TAU * k); c.stroke(); c.restore(); }
/* ================= Checkers (American rules: forced captures, multi-jumps, kings) ================= */
function ckOwn(p, seat) { return seat === 0 ? p > 0 : p < 0; }
function ckDirs(p) { if (Math.abs(p) === 2) return [[-1, -1], [-1, 1], [1, -1], [1, 1]]; return p > 0 ? [[-1, -1], [-1, 1]] : [[1, -1], [1, 1]]; }
function ckMoves(st) {
  const b = st.b, seat = st.turn, caps = [], steps = [];
  for (let sq = 0; sq < 64; sq++) {
    const p = b[sq]; if (!p || !ckOwn(p, seat)) continue; const r = sq >> 3, f = sq & 7;
    const dfs = (cr, cf, path, capd) => {

let lastT = 0;
function frame(t) {
  const dt = Math.min(0.05, Math.max(0, (t - lastT) / 1000)) || 0.016; lastT = t; App.t += dt;
  Input.poll(dt);
  try {
    if (UI.isOpen()) UI.update();
    else if (App.state === 'game' && (Input.anyHit(9) || Input.keyHit('Escape', 'KeyP'))) openPause();
    Hub.update(dt);
    if (App.state === 'game' && App.game && !UI.isOpen()) App.game.update(dt * (App.session && App.session.fast ? 3 : 1));
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (App.state === 'game' && App.game) { App.game.draw(ctx, W, H); updateGameHUD(); if (App.game.hint) setHint(UI.isOpen() ? '' : App.game.hint()); else setHint(''); }
    else { Hub.draw(ctx); if (App.state !== 'hub' || UI.isOpen()) setHint(''); }
